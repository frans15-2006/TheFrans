<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="16" fill="#F47920"/>
  <!-- Wheel left -->
  <circle cx="10" cy="22" r="5" fill="none" stroke="#0C0C0C" stroke-width="1.5"/>
  <!-- Wheel right -->
  <circle cx="22" cy="22" r="5" fill="none" stroke="#0C0C0C" stroke-width="1.5"/>
  <!-- Frame -->
  <polyline points="10,22 14,14 20,14 22,22" fill="none" stroke="#0C0C0C" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="14" y1="14" x2="22" y2="22" stroke="#0C0C0C" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Lightning bolt (charge indicator) -->
  <polygon points="18,8 15,14 18,13 15,19 20,12 17,13" fill="#0C0C0C" opacity="0.85"/>
</svg>
