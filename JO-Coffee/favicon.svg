<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#1A0F0A"/>
  <!-- Coffee cup -->
  <rect x="28" y="38" width="44" height="32" rx="6" fill="#3D2010"/>
  <rect x="28" y="38" width="44" height="12" rx="6" fill="#4A2A18"/>
