<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bambu Suites dusk facade illustration</title>
  <desc id="desc">A stylized near-black and amber resort scene with Palawan hills, palm leaves, and lit windows.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#090909"/>
      <stop offset="48%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>
    <radialGradient id="sun" cx="78%" cy="18%" r="34%">
      <stop offset="0%" stop-color="#f0a500" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#f0a500" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#f0a500" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f0a500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" x2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="45%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" x2="1">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#1d1d1d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f0a500" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#fff0bd" stop-opacity="0.52"/>
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

