<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Hollywood Fashion location map illustration</title>
  <desc id="desc">A stylized map of Rizal Avenue, Barangay San Miguel, Puerto Princesa City with a highlighted location pin.</desc>
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#14100a"/>
    </linearGradient>
    <filter id="blurMap" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#mapBg)"/>
  <circle cx="1210" cy="250" r="220" fill="#f0a500" opacity="0.12" filter="url(#blurMap)"/>
  <circle cx="300" cy="760" r="200" fill="#f0a500" opacity="0.07" filter="url(#blurMap)"/>

  <g opacity="0.16" stroke="#eaeaea" stroke-width="2">
    <path d="M0 140H1600M0 280H1600M0 420H1600M0 560H1600M0 700H1600M0 840H1600"/>
    <path d="M160 0V1000M420 0V1000M680 0V1000M940 0V1000M1200 0V1000M1460 0V1000"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 700C320 620 430 520 520 380S705 150 880 170c170 20 230 152 290 212 70 70 176 106 270 96" stroke="#f0a500" stroke-opacity="0.62" stroke-width="16"/>
    <path d="M140 760C330 660 460 560 560 420s184-244 330-250c122-4 205 44 272 108" stroke="#eaeaea" stroke-opacity="0.26" stroke-width="10"/>
    <path d="M780 120c98 8 164 48 220 120 50 64 88 134 144 186" stroke="#f0a500" stroke-opacity="0.42" stroke-width="8" stroke-dasharray="24 18"/>
  </g>

  <g>
    <path d="M770 575c0-72 58-130 130-130s130 58 130 130c0 94-130 232-130 232S770 669 770 575z" fill="#f0a500" fill-opacity="0.18" stroke="#f0a500" stroke-opacity="0.7" stroke-width="8"/>
    <circle cx="900" cy="575" r="52" fill="#f0a500" fill-opacity="0.82"/>
    <circle cx="900" cy="575" r="22" fill="#080808"/>
    <circle cx="900" cy="575" r="105" fill="none" stroke="#f0a500" stroke-opacity="0.26" stroke-width="10"/>
  </g>

  <g fill="#eaeaea" fill-opacity="0.72" font-family="JetBrains Mono, monospace" font-size="28" letter-spacing="1.2">
    <text x="150" y="140">RIZAL AVENUE</text>
    <text x="150" y="180">BARANGAY SAN MIGUEL</text>
    <text x="150" y="220">PUERTO PRINCESA CITY, PALAWAN</text>
  </g>
</svg>