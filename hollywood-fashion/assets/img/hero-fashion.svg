<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Hollywood Fashion hero illustration</title>
  <desc id="desc">A dark fashion showroom scene with a clothing rack, garments, shoes, a bag, and a perfume bottle.</desc>
  <defs>
