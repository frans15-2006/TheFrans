<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#231810"/>
      <stop offset="100%" stop-color="#0E0805"/>
    </radialGradient>
    <radialGradient id="plateGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2A1A10"/>
      <stop offset="100%" stop-color="#1A0F08"/>
    </radialGradient>
    <radialGradient id="glowRust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4522A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C4522A" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base square with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle warm glow center -->
  <ellipse cx="256" cy="240" rx="220" ry="200" fill="url(#glowRust)"/>

  <!-- Outer plate ring -->
  <circle cx="256" cy="248" r="176" fill="none" stroke="#FAF6EF" stroke-width="1" stroke-opacity="0.07"/>

  <!-- Mid plate ring -->
  <circle cx="256" cy="248" r="148" fill="url(#plateGrad)" stroke="#FAF6EF" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Inner plate shadow -->
  <circle cx="256" cy="248" r="112" fill="#18100A" stroke="#FAF6EF" stroke-width="0.5" stroke-opacity="0.06"/>

  <!-- Decorative thin accent ring -->
  <circle cx="256" cy="248" r="160" fill="none" stroke="#C9A55A" stroke-width="1" stroke-opacity="0.22"/>

  <!-- Rust arc accent top-right -->
  <path d="M 370 108 A 160 160 0 0 1 404 248" fill="none" stroke="#C4522A" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- "mf" serif monogram -->
  <!-- m -->
  <text
    x="256" y="276"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="108"
    font-weight="400"
    fill="#FAF6EF"
    text-anchor="middle"
    letter-spacing="-4"
    opacity="0.96"
    filter="url(#softGlow)"
  >mf</text>

  <!-- Rust dot accent below text -->
  <circle cx="256" cy="316" r="4" fill="#C4522A" opacity="0.85"/>

  <!-- Four tiny corner dots for polish -->
  <circle cx="156" cy="428" r="2" fill="#C9A55A" opacity="0.3"/>
  <circle cx="356" cy="428" r="2" fill="#C9A55A" opacity="0.3"/>
  <circle cx="156" cy="68" r="2" fill="#C9A55A" opacity="0.3"/>
  <circle cx="356" cy="68" r="2" fill="#C9A55A" opacity="0.3"/>
</svg>
