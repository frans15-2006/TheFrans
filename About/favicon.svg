<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TheFrans favicon">
  <defs>
    <radialGradient id="bgGlow" cx="30%" cy="26%" r="75%">
      <stop offset="0%" stop-color="#1a160f"/>
      <stop offset="55%" stop-color="#0b0b0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ead7a6"/>
      <stop offset="45%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#8c6f39"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1e2b9" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c8a96e" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="1 0 0 0 0.78
                0 1 0 0 0.66
                0 0 1 0 0.43
                0 0 0 0.6 0" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="#1d1a14" stroke-width="18"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.9"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#2c261a" stroke-width="2" opacity="0.7"/>

  <!-- subtle dossier grid -->
  <g opacity="0.18">
    <path d="M116 184 H396" stroke="#6c685d" stroke-width="2"/>
    <path d="M116 328 H396" stroke="#6c685d" stroke-width="2"/>
    <path d="M184 116 V396" stroke="#6c685d" stroke-width="2"/>
    <path d="M328 116 V396" stroke="#6c685d" stroke-width="2"/>
  </g>

  <!-- corner marks -->
  <g fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="square" opacity="0.9">
    <path d="M128 150 H174"/>
    <path d="M128 150 V196"/>
    <path d="M384 150 H338"/>
    <path d="M384 150 V196"/>
    <path d="M128 362 H174"/>
    <path d="M128 362 V316"/>
    <path d="M384 362 H338"/>
    <path d="M384 362 V316"/>
  </g>

  <!-- scan line -->
  <rect x="108" y="246" width="296" height="6" rx="3" fill="url(#gold)" opacity="0.18" filter="url(#softGlow)"/>

  <!-- monogram F -->
  <g transform="translate(0 0)">
    <rect x="178" y="140" width="58" height="232" rx="8" fill="url(#goldSoft)"/>
    <rect x="178" y="140" width="156" height="54" rx="8" fill="url(#goldSoft)"/>
    <rect x="178" y="228" width="120" height="52" rx="8" fill="url(#goldSoft)"/>
    <path d="M334 140 L352 140 L352 174 L334 174 Z" fill="#e6d2a0" opacity="0.45"/>
  </g>

  <circle cx="256" cy="256" r="160" fill="none" stroke="#e6d2a0" stroke-opacity="0.08" stroke-width="2"/>
</svg>
