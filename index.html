<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Frans — Rebuilding</title>
<meta name="description" content="Portfolio rebuild in progress. Back online shortly." />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#080808" />
<meta property="og:title" content="Frans — Rebuilding" />
<meta property="og:description" content="Portfolio rebuild in progress. Back online shortly." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://thefrans.is-a.dev/" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#080808;--text:#eaeaea;--text-2:#6e6e6e;--text-3:#333333;
    --border:rgba(255,255,255,0.06);
    --accent:#f0a500;--accent-hi:#ffbe30;--accent-dim:rgba(240,165,0,0.08);
    --mono:'DM Mono',monospace;--sans:'Bricolage Grotesque',sans-serif;
  }
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;-webkit-font-smoothing:antialiased;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;opacity:.025;z-index:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size:200px 200px;
  }
  .wrap{max-width:640px;padding:32px;text-align:center;position:relative;z-index:1}
  .status-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:36px;flex-wrap:wrap}
  .status-item{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2)}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2.2s ease-in-out infinite;flex-shrink:0}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,165,0,.4)}50%{box-shadow:0 0 0 6px rgba(240,165,0,0)}}
  .status-tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:4px 11px;border:1px solid rgba(240,165,0,.2);border-radius:4px;background:var(--accent-dim)}
  h1{font-size:clamp(28px,6vw,58px);font-weight:300;line-height:1.1;letter-spacing:-.03em;margin-bottom:22px}
  .ch{display:inline-block;white-space:pre;font-variation-settings:'wght' var(--w,300),'opsz' var(--o,32);transition:font-variation-settings .09s linear}
  p.sub{font-size:15px;color:var(--text-2);line-height:1.7;max-width:440px;margin:0 auto 40px}
  .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:56px}
  .links a{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);text-decoration:none;padding:10px 18px;border:1px solid var(--border);border-radius:8px;transition:color .2s,border-color .2s,background .2s;display:inline-block}
  .links a:hover{color:var(--text);border-color:rgba(255,255,255,.16);background:#0d0d0d}
  .foot{font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:.06em}
  @media(prefers-reduced-motion:reduce){
    .status-dot{animation:none}
    .ch{transition:none!important;font-variation-settings:'wght' 380,'opsz' 32!important}
  }
  @media(max-width:480px){
    h1{font-size:clamp(24px,8vw,38px)}
    .status-row{flex-direction:column;gap:10px}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="status-row">
    <div class="status-item"><span class="status-dot" aria-hidden="true"></span>Portfolio rebuilding</div>
    <span class="status-tag">Next version in progress</span>
  </div>
  <h1 id="headline"> Under Development Until further Notice </h1>
  <p class="sub">New interface, same production standard. thefrans.is-a.dev returns shortly.</p>
  <div class="links">
    <a href="https://www.facebook.com/franshessss" target="_blank" rel="noopener">Facebook &#8599;</a>
  </div>
  <div class="foot">&copy; 2026 Francis Tarectican</div>
</div>

<script>
(function(){
  var h = document.getElementById('headline');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var text = h.textContent;
  h.textContent = '';
  var chars = [];
  for (var i = 0; i < text.length; i++) {
    var s = document.createElement('span');
    s.className = 'ch';
    s.textContent = text[i];
    h.appendChild(s);
    chars.push(s);
  }
  if (reduced) return;

  var centers = [], heroRect = null;
  function measure(){
    heroRect = h.getBoundingClientRect();
    centers = chars.map(function(s){
      var cr = s.getBoundingClientRect();
      return cr.left - heroRect.left + cr.width / 2;
    });
  }
  measure();
  window.addEventListener('resize', measure);

  var targetX = null, smoothX = null;
  var MAXDIST = 240;
  document.addEventListener('mousemove', function(e){ targetX = e.clientX; });
  document.addEventListener('mouseleave', function(){ targetX = null; });

  function tick(){
    if (targetX !== null && heroRect) {
      var localX = targetX - heroRect.left;
      smoothX = smoothX === null ? localX : smoothX + (localX - smoothX) * 0.16;
    } else {
      smoothX = null;
    }
    chars.forEach(function(s, i){
      var t = smoothX === null ? 1 : Math.min(Math.abs(smoothX - (centers[i] || 0)) / MAXDIST, 1);
      s.style.setProperty('--w', Math.round(780 - t * (780 - 260)));
      s.style.setProperty('--o', (96 - t * (96 - 14)).toFixed(0));
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
