<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Warm spa-inspired abstract scene">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="45%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="44%" r="38%">
      <stop offset="0%" stop-color="#f0a500" stop-opacity="0.36"/>
      <stop offset="45%" stop-color="#f0a500" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f0a500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5c04e"/>
      <stop offset="100%" stop-color="#c57d00"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2b2b2b"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.38  0 0 0 0 0.12  0 0 0 .04 0"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <circle cx="1210" cy="445" r="170" fill="#f0a500" opacity="0.16" filter="url(#blur)"/>
