<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src * data: blob:; connect-src *;">
<title>TapKonek — Edit Card</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080B0E;
    --surface: #0F1318;
    --surface-2: #161C23;
    --line: #1E262F;
    --accent: #35D0BA;
    --accent-dim: rgba(53,208,186,0.12);
    --text: #F0F4F3;
    --text-muted: #7A8694;
    --danger: #FF5B5B;
    --danger-dim: rgba(255,91,91,0.1);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  body {
    display: flex; align-items: flex-start; justify-content: center;
    padding: 32px 16px 100px; position: relative; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    width: 360px; height: 360px;
    background: radial-gradient(circle, #35D0BA 0%, transparent 70%);
    top: -120px; right: -80px; filter: blur(80px); opacity: 0.18;
    animation: orb 14s ease-in-out infinite alternate;
  }
  @keyframes orb { from { transform: translate(0,0); } to { transform: translate(20px,30px); } }

  .wrap { width: 100%; max-width: 460px; position: relative; z-index: 1; }

  /* ---- Auth screen ---- */
  .auth-wrap {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 80vh; padding: 20px 0;
    animation: fadeIn 0.4s ease both;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  .auth-logo {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
    margin-bottom: 32px; display: flex; align-items: center; gap: 8px;
  }
  .auth-logo::before {
    content: '';
    width: 28px; height: 28px; border-radius: 7px;
    background: var(--accent-dim); border: 1px solid rgba(53,208,186,0.3);
    display: inline-flex; align-items: center; justify-content: center;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='none' stroke='%2335D0BA' stroke-width='1.6' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='3' y='6' width='18' height='12' rx='3'/%3E%3Cpath d='M7 6v12M17 6v12M3 10h4M17 10h4M3 14h4M17 14h4'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: center; background-size: 16px;
  }

  .auth-box {
    width: 100%; background: var(--surface); border: 1px solid var(--line);
    border-radius: 22px; padding: 36px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .auth-box h2 {
    font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700;
    margin: 0 0 6px; color: var(--text);
  }
  .auth-box p { color: var(--text-muted); font-size: 14px; margin: 0 0 28px; }
  .auth-divider {
    display: flex; align-items: center; gap: 10px; margin: 14px 0;
    font-size: 11px; color: var(--text-muted);
  }
  .auth-divider::before, .auth-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--line);
  }

  /* ---- Editor layout ---- */
  .editor-wrap { animation: fadeIn 0.4s ease both; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--line);
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar-logo {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent);
  }
  .topbar-sep { width: 1px; height: 16px; background: var(--line); }
  .topbar-title { font-size: 13px; color: var(--text-muted); }

  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: 1px solid var(--line); color: var(--text-muted);
    font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    font-family: 'Inter', sans-serif; transition: border-color 0.15s, color 0.15s;
  }
  .icon-btn svg { width: 14px; height: 14px; }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  /* Avatar section */
  .avatar-section {
    display: flex; align-items: center; gap: 20px;
    margin-bottom: 28px; padding: 20px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  }
  .avatar-wrap {
    position: relative; width: 80px; height: 80px;
    flex-shrink: 0; cursor: pointer;
  }
  .avatar-preview {
    width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
    background: var(--surface-2); border: 2px solid var(--line);
    display: block; transition: filter 0.2s ease;
  }
  .avatar-overlay {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(0,0,0,0.55); display: flex; align-items: center;
    justify-content: center; opacity: 0; transition: opacity 0.2s ease;
  }
  .avatar-overlay svg { width: 20px; height: 20px; color: #fff; }
  .avatar-wrap:hover .avatar-overlay { opacity: 1; }
  .avatar-wrap:hover .avatar-preview { filter: brightness(0.7); }

  .avatar-meta { flex: 1; min-width: 0; }
  .avatar-meta strong { display: block; font-size: 14px; margin-bottom: 4px; }
  .avatar-meta span { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 10px; }
  .upload-btn-sm {
    padding: 7px 14px; background: var(--surface-2); border: 1px solid var(--line);
    color: var(--text); border-radius: 8px; cursor: pointer;
    font-size: 12px; font-family: 'Inter', sans-serif;
    transition: border-color 0.15s;
  }
  .upload-btn-sm:hover { border-color: var(--accent); }

  /* Section cards */
  .section-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 20px; margin-bottom: 14px;
  }
  .section-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
  }
  .section-head-icon {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--accent-dim); border: 1px solid rgba(53,208,186,0.2);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .section-head-icon svg { width: 14px; height: 14px; color: var(--accent); }
  .section-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted);
  }

  /* Fields */
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
  .field input, .field textarea {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--radius); color: var(--text); font-family: 'Inter', sans-serif;
    font-size: 14px; padding: 11px 14px; outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease; resize: vertical;
  }
  .field input:focus, .field textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(53,208,186,0.1);
  }
  .field input.err, .field textarea.err { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-dim); }
  .field .hint { font-size: 11px; color: var(--text-muted); margin-top: 5px; }
  .field .err-msg { font-size: 11px; color: var(--danger); margin-top: 5px; display: none; }
  .field.has-err .err-msg { display: block; }

  /* Bio with counter */
  .bio-wrap { position: relative; }
  .bio-counter {
    position: absolute; bottom: 10px; right: 12px;
    font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace;
    pointer-events: none;
  }
  .bio-counter.warn { color: var(--danger); }
  .bio-textarea { padding-bottom: 28px !important; }

  /* Field row (two fields side by side) */
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 380px) { .field-row { grid-template-columns: 1fr; } }

  /* Bottom actions */
  .bottom-bar {
    position: sticky; bottom: 0; padding: 16px 0 0;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    margin-top: 8px;
  }
  .save-btn {
    width: 100%; padding: 15px; border: none; border-radius: var(--radius);
    background: var(--accent); color: #041A16;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px;
    cursor: pointer; transition: filter 0.15s ease, transform 0.15s ease;
    letter-spacing: 0.01em;
  }
  .save-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .save-btn:not(:disabled):hover { filter: brightness(1.1); }
  .save-btn:active { transform: scale(0.985); }

  .preview-row {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-top: 12px;
  }
  .preview-link {
    font-size: 12px; color: var(--accent); text-decoration: none;
    font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em;
    transition: opacity 0.15s;
  }
  .preview-link:hover { opacity: 0.75; }
  .copy-btn {
    display: flex; align-items: center; gap: 5px;
    background: none; border: 1px solid var(--line); color: var(--text-muted);
    font-size: 11px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
    font-family: 'Inter', sans-serif; transition: border-color 0.15s, color 0.15s;
  }
  .copy-btn svg { width: 12px; height: 12px; }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Toast */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--surface-2); border: 1px solid var(--accent);
    color: var(--text); padding: 10px 20px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 100; white-space: nowrap;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: var(--danger); }

  .state { text-align: center; padding: 80px 16px; color: var(--text-muted); font-size: 14px; }
  .auth-btn {
    width: 100%; padding: 14px; border: none; border-radius: var(--radius);
    background: var(--accent); color: #041A16;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px;
    cursor: pointer; transition: filter 0.15s ease; margin-bottom: 10px;
  }
  .auth-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .auth-btn:not(:disabled):hover { filter: brightness(1.1); }
  .auth-btn.secondary {
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line);
  }
  .auth-btn.secondary:hover { filter: none; border-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="state">Loading…</div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL      = "https://lyztkxqjywmjazhirykg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_2qPKpGDLAa-a2zVGfeRlXw_FGklS2Tl";
const BIO_MAX = 160;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null, currentProfile = null, pendingPhotoFile = null;

const SVG = {
  camera: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`,
  user:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
  phone:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L8 9.7a16 16 0 0 0 6 6z"/></svg>`,
  link:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
  logout: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>`,
  eye:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,
  copy:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
  chip:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7 6v12M17 6v12M3 10h4M17 10h4M3 14h4M17 14h4"/></svg>`,
};

function esc(s) { return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function safeUrl(s) { try { const u=new URL(s||""); return u.protocol==="http:"||u.protocol==="https:"; } catch { return false; } }
function toast(msg, isErr=false) {
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.toggle("err",isErr); t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2600);
}
function val(id) { return document.getElementById(id)?.value.trim()||""; }

// ---- Auth screen ----
function renderAuth() {
  document.getElementById("app").innerHTML = `
    <div class="auth-wrap">
      <div class="auth-logo">${SVG.chip} TapKonek</div>
      <div class="auth-box">
        <h2>Sign in</h2>
        <p>Manage your digital card.</p>
        <div class="field">
          <label for="auth-email">Email</label>
          <input id="auth-email" type="email" placeholder="you@email.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="auth-pass">Password</label>
          <input id="auth-pass" type="password" placeholder="Password" autocomplete="current-password">
        </div>
        <button class="auth-btn" id="login-btn">Sign in</button>
        <div class="auth-divider">or</div>
        <button class="auth-btn secondary" id="signup-btn">Create account</button>
      </div>
    </div>
  `;
  document.getElementById("login-btn").addEventListener("click", doLogin);
  document.getElementById("signup-btn").addEventListener("click", doSignup);
  document.getElementById("auth-pass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
}

async function doLogin() {
  const email=val("auth-email"), pass=val("auth-pass");
  if(!email||!pass) return toast("Fill in email and password.", true);
  const btn=document.getElementById("login-btn");
  btn.disabled=true; btn.textContent="Signing in…";
  const {error}=await sb.auth.signInWithPassword({email, password:pass});
  if(error) { toast(error.message, true); btn.disabled=false; btn.textContent="Sign in"; }
}
async function doSignup() {
  const email=val("auth-email"), pass=val("auth-pass");
  if(!email||!pass) return toast("Fill in email and password.", true);
  const btn=document.getElementById("signup-btn");
  btn.disabled=true; btn.textContent="Creating…";
  const {error}=await sb.auth.signUp({email, password:pass});
  if(error) { toast(error.message, true); btn.disabled=false; btn.textContent="Create account"; }
  else toast("Check your email to confirm your account.");
}

// ---- Editor ----
function renderEditor(profile) {
  const p=profile||{};
  const profileUrl = p.id
    ? `${location.origin}${location.pathname.replace("edit.html","profile.html")}?id=${p.id}`
    : "";

  document.getElementById("app").innerHTML = `
    <div class="editor-wrap">
      <div class="topbar">
        <div class="topbar-left">
          <span class="topbar-logo">TapKonek</span>
          <div class="topbar-sep"></div>
          <span class="topbar-title">Edit card</span>
        </div>
        <div class="topbar-actions">
          ${p.id ? `<a class="icon-btn" href="${esc(profileUrl)}" target="_blank" rel="noopener" id="preview-btn">${SVG.eye} Preview</a>` : ""}
          <button class="icon-btn danger" id="logout-btn">${SVG.logout} Sign out</button>
        </div>
      </div>

      <!-- Avatar -->
      <div class="avatar-section">
        <div class="avatar-wrap" id="avatar-wrap" title="Change photo">
          <img class="avatar-preview" id="avatar-preview"
            src="${p.photo_url ? esc(p.photo_url)+"?t="+Date.now() : ""}"
            onerror="this.src=''" alt="Photo">
          <div class="avatar-overlay">${SVG.camera}</div>
        </div>
        <div class="avatar-meta">
          <strong>${esc(p.full_name||"Your name")}</strong>
          <span>${p.username ? "@"+esc(p.username) : "Set your username below"}</span>
          <button class="upload-btn-sm" id="upload-btn">Change photo</button>
        </div>
        <input type="file" id="photo-input" accept="image/png,image/jpeg,image/webp" style="display:none">
      </div>

      <!-- Identity -->
      <div class="section-card">
        <div class="section-head">
          <div class="section-head-icon">${SVG.user}</div>
          <span class="section-label">Identity</span>
        </div>
        <div class="field">
          <label for="f-name">Full name <span style="color:var(--danger)">*</span></label>
          <input id="f-name" type="text" placeholder="Francis A. Tarectican" value="${esc(p.full_name||"")}">
          <span class="err-msg" id="err-name">Name is required.</span>
        </div>
        <div class="field">
          <label for="f-username">Username</label>
          <input id="f-username" type="text" placeholder="thefrans" value="${esc(p.username||"")}">
          <span class="hint">3–30 chars · lowercase letters, numbers, . and _</span>
          <span class="err-msg" id="err-username"></span>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-title">Job title</label>
            <input id="f-title" type="text" placeholder="IT Specialist" value="${esc(p.title||"")}">
          </div>
          <div class="field">
            <label for="f-company">Company / School</label>
            <input id="f-company" type="text" placeholder="BIR / PTCI" value="${esc(p.company||"")}">
          </div>
        </div>
        <div class="field">
          <label for="f-bio">Bio</label>
          <div class="bio-wrap">
            <textarea id="f-bio" class="bio-textarea" rows="3" maxlength="${BIO_MAX}" placeholder="A short intro about you…">${esc(p.bio||"")}</textarea>
            <span class="bio-counter" id="bio-counter">${(p.bio||"").length}/${BIO_MAX}</span>
          </div>
        </div>
      </div>

      <!-- Contact -->
      <div class="section-card">
        <div class="section-head">
          <div class="section-head-icon">${SVG.phone}</div>
          <span class="section-label">Contact</span>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-phone">Phone</label>
            <input id="f-phone" type="tel" placeholder="+63 912 345 6789" value="${esc(p.phone||"")}">
          </div>
          <div class="field">
            <label for="f-email">Email</label>
            <input id="f-email" type="email" placeholder="you@email.com" value="${esc(p.email||"")}">
          </div>
        </div>
        <div class="field">
          <label for="f-website">Website</label>
          <input id="f-website" type="url" placeholder="https://yoursite.com" value="${esc(p.website||"")}">
          <span class="err-msg" id="err-website">Must be a valid https:// URL.</span>
        </div>
      </div>

      <!-- Socials -->
      <div class="section-card">
        <div class="section-head">
          <div class="section-head-icon">${SVG.link}</div>
          <span class="section-label">Social links</span>
        </div>
        <div class="field">
          <label for="f-facebook">Facebook</label>
          <input id="f-facebook" type="url" placeholder="https://facebook.com/you" value="${esc(p.facebook||"")}">
          <span class="err-msg" id="err-facebook">Must be a valid https:// URL.</span>
        </div>
        <div class="field">
          <label for="f-instagram">Instagram</label>
          <input id="f-instagram" type="url" placeholder="https://instagram.com/you" value="${esc(p.instagram||"")}">
          <span class="err-msg" id="err-instagram">Must be a valid https:// URL.</span>
        </div>
        <div class="field">
          <label for="f-tiktok">TikTok</label>
          <input id="f-tiktok" type="url" placeholder="https://tiktok.com/@you" value="${esc(p.tiktok||"")}">
          <span class="err-msg" id="err-tiktok">Must be a valid https:// URL.</span>
        </div>
        <div class="field">
          <label for="f-linkedin">LinkedIn</label>
          <input id="f-linkedin" type="url" placeholder="https://linkedin.com/in/you" value="${esc(p.linkedin||"")}">
          <span class="err-msg" id="err-linkedin">Must be a valid https:// URL.</span>
        </div>
      </div>

      <!-- Bottom bar -->
      <div class="bottom-bar">
        <button class="save-btn" id="save-btn">Save changes</button>
        ${profileUrl ? `
        <div class="preview-row">
          <a class="preview-link" href="${esc(profileUrl)}" target="_blank" rel="noopener">View card</a>
          <button class="copy-btn" id="copy-url-btn">${SVG.copy} Copy URL</button>
        </div>` : ""}
      </div>
    </div>
  `;

  // Bio counter
  const bioEl=document.getElementById("f-bio");
  const counter=document.getElementById("bio-counter");
  bioEl?.addEventListener("input",()=>{
    const len=bioEl.value.length;
    counter.textContent=`${len}/${BIO_MAX}`;
    counter.classList.toggle("warn", len > BIO_MAX * 0.85);
  });

  // Avatar click → file input
  const triggerUpload=()=>document.getElementById("photo-input").click();
  document.getElementById("avatar-wrap")?.addEventListener("click", triggerUpload);
  document.getElementById("upload-btn")?.addEventListener("click", e=>{ e.stopPropagation(); triggerUpload(); });

  document.getElementById("photo-input").addEventListener("change", e=>{
    const file=e.target.files[0]; if(!file) return;
    if(file.size > 2*1024*1024) return toast("Photo must be under 2 MB.", true);
    pendingPhotoFile=file;
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=document.getElementById("avatar-preview");
      img.src=ev.target.result; img.style.visibility="visible";
    };
    reader.readAsDataURL(file);
    toast("Photo selected — save to apply.");
  });

  document.getElementById("logout-btn")?.addEventListener("click",async()=>{ await sb.auth.signOut(); });
  document.getElementById("save-btn")?.addEventListener("click", doSave);

  // Copy URL button
  document.getElementById("copy-url-btn")?.addEventListener("click",()=>{
    navigator.clipboard.writeText(profileUrl).then(()=>toast("Card URL copied.")).catch(()=>toast("Copy failed.", true));
  });
}

// ---- Validate + Save ----
function fieldErr(id, errId, show, msg) {
  const field=document.getElementById(id)?.closest(".field");
  const errEl=document.getElementById(errId);
  if(field) field.classList.toggle("has-err", show);
  if(errEl) { errEl.style.display=show?"block":"none"; if(msg) errEl.textContent=msg; }
  document.getElementById(id)?.classList.toggle("err", show);
}

async function doSave() {
  const btn=document.getElementById("save-btn");
  btn.disabled=true; btn.textContent="Saving…";
  let valid=true;

  const name=val("f-name"), username=val("f-username"),
        website=val("f-website"), facebook=val("f-facebook"),
        instagram=val("f-instagram"), tiktok=val("f-tiktok"), linkedin=val("f-linkedin");

  fieldErr("f-name","err-name",!name,"Name is required.");
  if(!name) valid=false;

  const usernameOk=/^[a-z0-9_.]{3,30}$/.test(username);
  if(username&&!usernameOk) {
    fieldErr("f-username","err-username",true,"3–30 chars, lowercase letters, numbers, . and _ only.");
    valid=false;
  } else { fieldErr("f-username","err-username",false); }

  [{v:website,id:"f-website",err:"err-website"},
   {v:facebook,id:"f-facebook",err:"err-facebook"},
   {v:instagram,id:"f-instagram",err:"err-instagram"},
   {v:tiktok,id:"f-tiktok",err:"err-tiktok"},
   {v:linkedin,id:"f-linkedin",err:"err-linkedin"}
  ].forEach(({v,id,err})=>{
    const bad=v&&!safeUrl(v);
    fieldErr(id,err,bad);
    if(bad) valid=false;
  });

  if(!valid) { btn.disabled=false; btn.textContent="Save changes"; toast("Fix the errors above.", true); return; }

  // Upload photo
  let photoUrl=currentProfile?.photo_url||null;
  if(pendingPhotoFile) {
    const ext=pendingPhotoFile.name.split(".").pop().toLowerCase();
    const path=`${currentUser.id}/avatar.${ext}`;
    const {error:upErr}=await sb.storage.from("profile-photos")
      .upload(path, pendingPhotoFile, {upsert:true, contentType:pendingPhotoFile.type});
    if(upErr) { toast("Photo upload failed: "+upErr.message, true); btn.disabled=false; btn.textContent="Save changes"; return; }
    const {data:pubData}=sb.storage.from("profile-photos").getPublicUrl(path);
    photoUrl=pubData?.publicUrl||null;
    pendingPhotoFile=null;
  }

  const payload={
    user_id:   currentUser.id,
    username:  username||undefined,
    full_name: name,
    title:     val("f-title")||null,
    company:   val("f-company")||null,
    bio:       val("f-bio")||null,
    phone:     val("f-phone")||null,
    email:     val("f-email")||null,
    website:   website||null,
    facebook:  facebook||null,
    instagram: instagram||null,
    tiktok:    tiktok||null,
    linkedin:  linkedin||null,
    photo_url: photoUrl,
  };

  const {error}=currentProfile
    ? await sb.from("profiles").update(payload).eq("user_id", currentUser.id)
    : await sb.from("profiles").insert(payload);

  btn.disabled=false; btn.textContent="Save changes";

  if(error) {
    if(error.code==="23505") toast("That username is already taken.", true);
    else toast("Save failed: "+error.message, true);
  } else {
    toast("Saved.");
    const {data}=await sb.from("profiles").select("*").eq("user_id",currentUser.id).single();
    currentProfile=data;
    // Refresh avatar live (cache-buster)
    if(data?.photo_url) {
      const img=document.getElementById("avatar-preview");
      if(img) img.src=data.photo_url+"?t="+Date.now();
    }
  }
}

// ---- Boot ----
async function loadEditor(user) {
  currentUser=user;
  const {data,error}=await sb.from("profiles").select("*").eq("user_id",user.id).maybeSingle();
  if(error) toast("Failed to load profile.", true);
  currentProfile=data||null;
  renderEditor(currentProfile);
}

sb.auth.onAuthStateChange(async(event,session)=>{
  if(session?.user) { await loadEditor(session.user); }
  else { currentUser=null; currentProfile=null; pendingPhotoFile=null; renderAuth(); }
});
</script>
