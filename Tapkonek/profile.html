<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src * data: blob:; connect-src *;">
<title>TapKonek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0E11;
    --surface: #12161B;
    --surface-2: #191F26;
    --line: #232A32;
    --accent: #35D0BA;
    --accent-2: #6C8CFF;
    --text: #F4F6F5;
    --text-muted: #8A93A0;
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  body { display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px 64px; }
  .wrap { width: 100%; max-width: 400px; }
  .card { position: relative; background: linear-gradient(160deg, var(--surface) 0%, var(--surface-2) 100%); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 24px 24px; overflow: hidden; }
  .chip { position: absolute; top: 20px; right: 20px; width: 34px; height: 34px; }
  .chip svg { width: 100%; height: 100%; color: var(--accent); }
  .ripple { position: absolute; top: 37px; right: 37px; width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--accent); opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
  .ripple.animate { animation: ripple 1.6s ease-out; }
  .ripple:nth-child(3) { animation-delay: 0.35s; }
  @keyframes ripple { 0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.3); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(6); } }
  .avatar { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; background: var(--surface-2); border: 2px solid var(--line); display: block; }
  .name { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; margin: 16px 0 2px; line-height: 1.15; }
  .role { color: var(--text-muted); font-size: 14px; margin: 0 0 4px; }
  .handle { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: var(--accent); text-transform: uppercase; }
  .bio { margin-top: 14px; font-size: 14px; line-height: 1.55; color: var(--text-muted); }
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 22px; }
  .action { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--text); font-size: 11px; font-weight: 500; transition: border-color 0.15s ease, transform 0.15s ease; }
  .action:hover { border-color: var(--accent); transform: translateY(-1px); }
  .action:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .action svg { width: 20px; height: 20px; color: var(--accent-2); }
  .action.disabled { opacity: 0.3; pointer-events: none; }
  .save-btn { width: 100%; margin-top: 18px; padding: 15px; border: none; border-radius: 14px; background: var(--accent); color: #06201C; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; transition: filter 0.15s ease; }
  .save-btn:hover { filter: brightness(1.08); }
  .save-btn:active { transform: scale(0.99); }
  .links { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .link-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--text); font-size: 13px; word-break: break-all; }
  .link-row svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--text-muted); }
  .footer { text-align: center; margin-top: 20px; font-size: 11px; color: var(--text-muted); }
  .footer a { color: var(--accent); text-decoration: none; }
  .state { text-align: center; padding: 60px 16px; color: var(--text-muted); font-size: 14px; }
  .state strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; font-family: 'Space Grotesk', sans-serif; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface-2); border: 1px solid var(--accent); color: var(--text); padding: 10px 18px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="state">Loading card…</div></div>
<div class="toast" id="toast"></div>
<script>
// ---- CONFIG ----
const SUPABASE_URL = "https://lyztkxqjywmjazhirykg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_2qPKpGDLAa-a2zVGfeRlXw_FGklS2Tl";
// ----------------

const ICONS = {
  chip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7 6v12M17 6v12M3 10h4M17 10h4M3 14h4M17 14h4"/></svg>',
  call: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L8 9.7a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2z"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>',
  msg:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4 8.6 8.6 0 0 1-3.9-.9L3 20l1.1-4A8.4 8.4 0 1 1 21 11.5z"/></svg>',
  site: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/></svg>',
  fb:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>',
  ig:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>',
  tt:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 2v12.5a3.5 3.5 0 1 1-3-3.46V8a6 6 0 1 0 6 6V8.5a6.5 6.5 0 0 0 4 1.5V6.8A4.5 4.5 0 0 1 19.5 6 4.5 4.5 0 0 1 16 2z"/></svg>',
  li:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M7 10v7M7 7v.01M12 17v-4.5a2.5 2.5 0 0 1 5 0V17"/></svg>'
};

// Escape for text content
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Escape for HTML attribute values
function escAttr(s) {
  return String(s || "").replace(/[&<>"'`]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;","`":"&#96;"}[c]));
}

// Only allow http/https URLs, reject javascript: data: etc.
function safeUrl(s) {
  try {
    const u = new URL(s || "");
    if (u.protocol !== "http:" && u.protocol !== "https:") return null;
    return u.href;
  } catch { return null; }
}

// Safe tel: and mailto: links only
function safeTel(s) {
  if (!s) return null;
  return "tel:" + encodeURIComponent(s.trim());
}
function safeSms(s) {
  if (!s) return null;
  return "sms:" + encodeURIComponent(s.trim());
}
function safeMail(s) {
  if (!s) return null;
  // basic email sanity
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)) return null;
  return "mailto:" + encodeURIComponent(s.trim());
}

// vCard field escaping per RFC 2426
function vcEsc(s) {
  return String(s || "")
    .replace(/\\/g, "\\\\")
    .replace(/,/g, "\\,")
    .replace(/;/g, "\\;")
    .replace(/\r?\n/g, "\\n");
}

function buildVCard(p) {
  const lines = [
    "BEGIN:VCARD", "VERSION:3.0",
    `N:${vcEsc(p.full_name)};;;;`,
    `FN:${vcEsc(p.full_name)}`,
  ];
  if (p.company) lines.push(`ORG:${vcEsc(p.company)}`);
  if (p.title)   lines.push(`TITLE:${vcEsc(p.title)}`);
  if (p.phone)   lines.push(`TEL;TYPE=CELL:${vcEsc(p.phone)}`);
  if (p.email)   lines.push(`EMAIL:${vcEsc(p.email)}`);
  if (p.website && safeUrl(p.website)) lines.push(`URL:${vcEsc(p.website)}`);
  if (p.photo_url && safeUrl(p.photo_url)) lines.push(`PHOTO;VALUE=uri:${vcEsc(p.photo_url)}`);
  lines.push("END:VCARD");
  return lines.join("\r\n");
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function saveToContacts(p) {
  const vcf = buildVCard(p);
  const blob = new Blob([vcf], { type: "text/vcard" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = esc(p.full_name).replace(/\s+/g, "_") + ".vcf";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast("Contact card downloaded");
}

function makeActionLink(href, icon, label, disabled) {
  const a = document.createElement("a");
  a.className = "action" + (disabled ? " disabled" : "");
  if (!disabled && href) a.href = href;
  if (href && href.startsWith("http")) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
  a.innerHTML = icon + `<span>${esc(label)}</span>`;
  return a;
}

function render(p) {
  const app = document.getElementById("app");

  // Safe resolved URLs
  const photoUrl  = safeUrl(p.photo_url);
  const websiteUrl = safeUrl(p.website);
  const fbUrl  = safeUrl(p.facebook);
  const igUrl  = safeUrl(p.instagram);
  const ttUrl  = safeUrl(p.tiktok);
  const liUrl  = safeUrl(p.linkedin);
  const callHref = safeTel(p.phone);
  const smsHref  = safeSms(p.phone);
  const mailHref = safeMail(p.email);

  // Build card DOM safely — no innerHTML for user data
  const card = document.createElement("div");
  card.className = "card";

  // Chip + ripple
  card.innerHTML = `<div class="chip">${ICONS.chip}</div><div class="ripple animate"></div><div class="ripple animate"></div>`;

  // Avatar
  if (photoUrl) {
    const img = document.createElement("img");
    img.className = "avatar";
    img.src = photoUrl;
    img.alt = p.full_name;
    img.onerror = function() { this.style.visibility = "hidden"; };
    card.appendChild(img);
  }

  // Name
  const h1 = document.createElement("h1");
  h1.className = "name";
  h1.textContent = p.full_name;
  card.appendChild(h1);

  // Role
  if (p.title || p.company) {
    const role = document.createElement("p");
    role.className = "role";
    role.textContent = [p.title, p.company].filter(Boolean).join(" · ");
    card.appendChild(role);
  }

  // Handle
  const handle = document.createElement("span");
  handle.className = "handle";
  handle.textContent = "@" + p.username;
  card.appendChild(handle);

  // Bio
  if (p.bio) {
    const bio = document.createElement("p");
    bio.className = "bio";
    bio.textContent = p.bio;
    card.appendChild(bio);
  }

  // Action buttons
  const actions = document.createElement("div");
  actions.className = "actions";
  actions.appendChild(makeActionLink(callHref,   ICONS.call, "Call",  !callHref));
  actions.appendChild(makeActionLink(smsHref,    ICONS.msg,  "Text",  !smsHref));
  actions.appendChild(makeActionLink(mailHref,   ICONS.mail, "Email", !mailHref));
  actions.appendChild(makeActionLink(websiteUrl, ICONS.site, "Site",  !websiteUrl));
  card.appendChild(actions);

  // Save button
  const btn = document.createElement("button");
  btn.className = "save-btn";
  btn.textContent = "Save to contacts";
  btn.addEventListener("click", () => saveToContacts(p));
  card.appendChild(btn);

  // Social links
  const socials = [
    fbUrl && { icon: ICONS.fb, href: fbUrl, label: "Facebook" },
    igUrl && { icon: ICONS.ig, href: igUrl, label: "Instagram" },
    ttUrl && { icon: ICONS.tt, href: ttUrl, label: "TikTok" },
    liUrl && { icon: ICONS.li, href: liUrl, label: "LinkedIn" },
  ].filter(Boolean);

  if (socials.length) {
    const links = document.createElement("div");
    links.className = "links";
    socials.forEach(s => {
      const a = document.createElement("a");
      a.className = "link-row";
      a.href = s.href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.innerHTML = s.icon;
      const span = document.createElement("span");
      span.textContent = s.label;
      a.appendChild(span);
      links.appendChild(a);
    });
    card.appendChild(links);
  }

  const footer = document.createElement("div");
  footer.className = "footer";
  footer.innerHTML = 'Powered by <a href="/" rel="noopener">TapKonek</a>';

  app.innerHTML = "";
  app.appendChild(card);
  app.appendChild(footer);
}

function renderState(title, body) {
  document.getElementById("app").innerHTML =
    `<div class="state"><strong>${esc(title)}</strong>${esc(body)}</div>`;
}

async function main() {
  const params   = new URLSearchParams(location.search);
  // Use immutable profile ID if present, fallback to username for legacy
  const profileId = (params.get("id") || "").trim();
  const username  = (params.get("u") || "").trim().toLowerCase();

  if (!profileId && !username) return renderState("No card specified", "Add ?id=<uuid> to the URL.");

  const filter = profileId
    ? `id=eq.${encodeURIComponent(profileId)}`
    : `username=eq.${encodeURIComponent(username)}`;

  // Only fetch columns needed for display — no internal fields
  const select = "id,username,full_name,title,company,bio,phone,email,website,photo_url,facebook,instagram,tiktok,linkedin";

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/profiles?${filter}&select=${select}&limit=1`,
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    if (!rows.length) return renderState("Card not found", profileId ? `No profile found.` : `No profile at @${username}.`);
    render(rows[0]);
  } catch {
    renderState("Couldn't load card", "Check your connection and try again.");
  }
}

main();
</script>
</body>
</html>
