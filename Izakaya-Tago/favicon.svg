<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5a623"/>
      <stop offset="100%" style="stop-color:#e8820c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Gold accent line top -->
  <rect x="18" y="14" width="30" height="3" rx="1.5" fill="url(#gold)"/>
  <!-- F -->
  <text x="16" y="72" font-family="Georgia, serif" font-size="58" font-weight="bold" fill="url(#gold)">F</text>
  <!-- T -->
  <text x="52" y="72" font-family="Georgia, serif" font-size="58" font-weight="bold" fill="white" opacity="0.92">T</text>
  <!-- Gold accent dot -->
  <circle cx="82" cy="78" r="4" fill="url(#gold)"/>
</svg>
