<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Airo Hotel Manila facade illustration</title>
  <desc id="desc">A dark city stay scene with a glowing hotel facade in Ermita, Manila.</desc>
