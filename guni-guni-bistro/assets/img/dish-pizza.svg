<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Pizza Margherita illustration</title>
  <desc id="desc">A dark tabletop with a pizza slice, melted cheese, and basil garnish in amber light.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#18120a"/>
    </linearGradient>
    <radialGradient id="amber" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f0a500" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0a500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7c65a"/>
      <stop offset="100%" stop-color="#e18d1e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="470" cy="300" r="360" fill="url(#amber)"/>
  <ellipse cx="620" cy="700" rx="350" ry="90" fill="#000" opacity="0.45"/>
