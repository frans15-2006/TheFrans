    <path d="M-125 -70 L104 -15 L49 135 L-95 119 Z" fill="#ffd892" opacity="0.78"/>
    <circle cx="-65" cy="-56" r="15" fill="#b73d1e"/>
    <circle cx="-5" cy="-33" r="15" fill="#b73d1e"/>
    <circle cx="55" cy="-10" r="15" fill="#b73d1e"/>
    <circle cx="20" cy="35" r="15" fill="#b73d1e"/>
    <circle cx="-35" cy="62" r="15" fill="#b73d1e"/>
    <path d="M-25 -110 C20 -125, 70 -110, 116 -88" stroke="#5a8e3a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M-210 35 C-150 -50, 60 -75, 190 20" stroke="#f0a500" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.42"/>
    <path d="M-200 105 C-110 35, 80 35, 195 88" stroke="#eaeaea" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.22"/>
